; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Upload_UPDI

; Shared by the ATtiny1614 environments. Not inherited by native tests.
; Clock is 16 MHz internal: safe for both the 16 MHz and 20 MHz speed grades.
; Brown-out is 2.6 V, the tinyAVR level for a 3.3 V rail.
; updipin must stay updi. gpio or reset turns PA0 off the programming wire.
[attiny]
platform = atmelmegaavr
framework = arduino
board = ATtiny1614
board_build.f_cpu = 16000000L
board_hardware.oscillator = internal
board_hardware.updipin = updi
board_hardware.uart = no_bootloader
board_hardware.bod = 2.6v
board_hardware.eesave = yes
upload_protocol = serialupdi
upload_port = COM3
upload_speed = 115200

; Upload the image over SerialUPDI.
; pio run -e Upload_UPDI -t upload
[env:Upload_UPDI]
extends = attiny

; Burn the fuses over the same SerialUPDI port. Does not upload the image.
; pio run -e fuses -t fuses
[env:fuses]
extends = attiny

; Desktop Unity tests. No board required.
[env:native]
platform = native
test_framework = unity
